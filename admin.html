<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baú de Achadinhos — Admin</title>
<style>
  :root{--bg:#efe7d6;--card:#fff;--marrom:#4a3526;--marrom2:#6d5137;--destaque:#a8703c;--verde:#4e6b2d}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--marrom);padding:24px 16px;line-height:1.5}
  .wrap{max-width:640px;margin:0 auto}
  h1{font-size:22px;margin-bottom:4px}
  .sub{color:var(--marrom2);font-size:13px;margin-bottom:20px}
  .box{background:var(--card);border-radius:14px;padding:20px;box-shadow:0 4px 14px rgba(74,53,38,.12);margin-bottom:16px}
  label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}
  input[type=email],input[type=password],input[type=file]{width:100%;padding:11px 13px;border:1.5px solid #d9c9a7;border-radius:10px;font-size:15px;background:#fff}
  button{background:var(--verde);color:#fff;border:none;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer;margin-top:12px}
  button:disabled{opacity:.5;cursor:default}
  button.sec{background:#f2e7d2;color:var(--marrom)}
  .hid{display:none}
  #log{background:#1e1a14;color:#cfe0b4;font-family:monospace;font-size:12px;border-radius:10px;padding:12px;margin-top:14px;max-height:340px;overflow:auto;white-space:pre-wrap}
  .ok{color:#7bbf5a}.err{color:#e57373}.warn{color:#e6b34a}
  .bar{height:10px;background:#e7d8ba;border-radius:6px;overflow:hidden;margin-top:10px}
  .bar>i{display:block;height:100%;background:var(--verde);width:0}
  .who{font-size:12px;color:var(--marrom2)}
  a{color:var(--destaque)}
  .opt{font-size:13px;display:flex;align-items:center;gap:8px;margin-top:8px}
  .opt input{width:auto}
</style>
</head>
<body>
<div class="wrap">
  <h1>🧺 Baú de Achadinhos — Painel</h1>
  <div class="sub">Área administrativa. Acesso restrito.</div>

  <!-- LOGIN -->
  <div class="box" id="boxLogin">
    <label>E-mail</label>
    <input type="email" id="email" placeholder="seu@email.com" autocomplete="username">
    <label>Senha</label>
    <input type="password" id="senha" placeholder="sua senha" autocomplete="current-password">
    <button id="btnLogin">Entrar</button>
    <div id="loginMsg" class="sub" style="margin-top:10px"></div>
  </div>

  <!-- PAINEL -->
  <div class="box hid" id="boxPainel">
    <div class="who" id="who"></div>
    <div id="stats" style="font-size:15px;font-weight:700;margin:8px 0"></div>
    <button class="sec" id="btnCount">🔄 Atualizar contagem</button>
    <button class="sec" id="btnLogout" style="float:right">Sair</button>
  </div>

  <!-- IMPORTAÇÃO -->
  <div class="box hid" id="boxImport">
    <h1 style="font-size:17px">📦 Importar catálogo (migração)</h1>
    <div class="sub">Selecione o arquivo <b>backup-final.json</b> que você já tem. Ele envia as peças e as fotos (com miniatura) pro banco. Pode rodar mais de uma vez sem duplicar (atualiza pelo código).</div>
    <label>Arquivo do backup (.json)</label>
    <input type="file" id="arquivo" accept="application/json,.json">
    <label class="opt"><input type="checkbox" id="optThumb" checked> Gerar miniaturas das fotos (recomendado)</label>
    <button id="btnImport" disabled>Importar para o banco</button>
    <div class="bar"><i id="barfill"></i></div>
    <div id="log"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL = "https://ujcvjycnwfuuylfwdjuu.supabase.co";
const SB_KEY = "sb_publishable_hy-_Bq4JePg5g_FrzGPM1g_biJBRiFn";
const BUCKET = "fotos";
const db = window.supabase.createClient(SB_URL, SB_KEY);

const $ = id => document.getElementById(id);
function log(msg, cls){ const d=$("log"); d.innerHTML += '<div class="'+(cls||'')+'">'+msg+'</div>'; d.scrollTop=d.scrollHeight; }
function num(v){ if(v==null) return 0; v=(''+v).replace(/[^\d,.-]/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.'); const n=parseFloat(v); return isNaN(n)?0:n; }
function dataURLtoBlob(d){ const [h,b]=d.split(','); const mime=(h.match(/:(.*?);/)||[,'image/jpeg'])[1]; const bin=atob(b); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return new Blob([u],{type:mime}); }

// gera uma miniatura (JPEG) a partir de um dataURL
function makeThumb(dataUrl, maxW){
  return new Promise(function(res){
    try{
      const img=new Image();
      img.onload=function(){
        const scale=Math.min(1, maxW/(img.width||maxW));
        const w=Math.max(1,Math.round((img.width||maxW)*scale)), h=Math.max(1,Math.round((img.height||maxW)*scale));
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        cv.toBlob(function(bl){ res(bl||null); }, 'image/jpeg', 0.72);
      };
      img.onerror=function(){ res(null); };
      img.src=dataUrl;
    }catch(e){ res(null); }
  });
}

// ---- login ----
$("btnLogin").addEventListener("click", async ()=>{
  $("loginMsg").textContent="Entrando...";
  const { data, error } = await db.auth.signInWithPassword({ email:$("email").value.trim(), password:$("senha").value });
  if(error){ $("loginMsg").innerHTML='<span style="color:#c0392b">Erro: '+error.message+'</span>'; return; }
  mostrarPainel(data.user);
});
$("btnLogout").addEventListener("click", async ()=>{ await db.auth.signOut(); location.reload(); });

async function mostrarPainel(user){
  $("boxLogin").classList.add("hid");
  $("boxPainel").classList.remove("hid");
  $("boxImport").classList.remove("hid");
  $("who").textContent = "Logada como: " + (user?.email||"");
  contar();
}
async function contar(){
  $("stats").textContent = "Contando...";
  const { count, error } = await db.from("pecas").select("*",{count:"exact",head:true});
  if(error){ $("stats").innerHTML='<span style="color:#c0392b">Erro ao ler: '+error.message+'</span>'; return; }
  $("stats").textContent = "📊 Peças no banco: " + (count||0);
}
$("btnCount").addEventListener("click", contar);

// ---- importação ----
$("arquivo").addEventListener("change", ()=>{ $("btnImport").disabled = !$("arquivo").files.length; });

async function subirFoto(codigo, n, dataUrl, fazerThumb){
  const path = codigo+"-"+n+".jpg";
  const { error:e } = await db.storage.from(BUCKET).upload(path, dataURLtoBlob(dataUrl), {upsert:true, contentType:"image/jpeg"});
  if(e) throw new Error("foto"+n+": "+e.message);
  if(fazerThumb){
    let tb = await makeThumb(dataUrl, 520);
    if(!tb) tb = dataURLtoBlob(dataUrl); // fallback: usa a foto cheia como miniatura
    const tpath = codigo+"-"+n+"-t.jpg";
    await db.storage.from(BUCKET).upload(tpath, tb, {upsert:true, contentType:"image/jpeg"});
  }
  return path;
}

$("btnImport").addEventListener("click", async ()=>{
  const f = $("arquivo").files[0]; if(!f) return;
  const fazerThumb = $("optThumb").checked;
  $("btnImport").disabled=true; $("log").innerHTML="";
  log("Lendo arquivo...");
  let arr;
  try{ arr = JSON.parse(await f.text()); }catch(e){ log("Arquivo inválido: "+e.message,"err"); $("btnImport").disabled=false; return; }
  if(!Array.isArray(arr)){ log("O backup não é uma lista de peças.","err"); $("btnImport").disabled=false; return; }
  log("Peças no arquivo: "+arr.length,"ok");
  const base = Date.now();
  let ok=0, fail=0;
  for(let i=0;i<arr.length;i++){
    const p=arr[i], c=p.campos||{};
    const codigo=(c["in-codigo"]||"").trim();
    const nome=c["in-titulo"]||p.nome||"Peça";
    if(!codigo){ log("["+(i+1)+"] "+nome+" — SEM CÓDIGO, pulada","warn"); fail++; continue; }
    try{
      let u1="", u2="";
      const fotos=p.fotos||{};
      if(fotos["1"] && (""+fotos["1"]).startsWith("data:")) u1 = await subirFoto(codigo,1,fotos["1"],fazerThumb);
      if(fotos["2"] && (""+fotos["2"]).startsWith("data:")) u2 = await subirFoto(codigo,2,fotos["2"],fazerThumb);

      const vendido = (p.selo||"") === "vendido";
      const row = {
        codigo,
        titulo: nome,
        descricao: c["in-desc"]||"",
        categoria: c["in-categoria"]||"",
        subcategoria: c["in-subcat"]||"",
        rotulo_tam: c["in-rotulo"]||"",
        tamanho: c["in-tam"]||"",
        veste: c["in-veste"]||"",
        preco: num(c["in-valor"]),
        preco_ref: num(c["in-precoref"]),
        sinopse: c["in-sinopse"]||"",
        selo: p.selo||"",
        status: vendido ? "vendido" : "disponivel",
        disponivel: true,
        foto1: u1,
        foto2: u2,
        criado_em: new Date(base - i*1000).toISOString()
      };
      const { error:ei } = await db.from("pecas").upsert(row,{onConflict:"codigo"});
      if(ei) throw new Error("banco: "+ei.message);
      ok++; log("["+(i+1)+"/"+arr.length+"] ✓ "+codigo+" — "+nome+(vendido?" (VENDIDO)":""),"ok");
    }catch(e){
      fail++; log("["+(i+1)+"/"+arr.length+"] ✗ "+codigo+" — "+e.message,"err");
    }
    $("barfill").style.width = Math.round((i+1)/arr.length*100)+"%";
  }
  log("\nCONCLUÍDO: "+ok+" enviadas, "+fail+" com erro.", fail?"warn":"ok");
  contar();
  $("btnImport").disabled=false;
});

// sessão persistente
db.auth.getSession().then(({data})=>{ if(data.session) mostrarPainel(data.session.user); });
</script>
</body>
</html>
